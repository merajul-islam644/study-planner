<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Study Planner — plan subjects, sessions, assignments and exams in one place." />
    <meta name="theme-color" content="#0a9bb0" />
    <title>Study Planner</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a9bb0'/%3E%3Cpath d='M6 5h9a3 3 0 0 1 3 3v11H9a3 3 0 0 1-3-3V5Z' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cpath d='M6 16a3 3 0 0 1 3-3h9' fill='none' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved appearance before first paint so a dark-mode user
      // never sees a light flash. Kept tiny and inline on purpose.
      (function () {
        try {
          var stored = localStorage.getItem("study-planner:appearance");
          var dark = stored === "dark" || ((!stored || stored === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
